                    h += '<button type="button" data-accion="filtro" data-color="' + esc(f) + '" class="' + (estado.filtro === f ? 'activo' : '') + '">' + esc(etiqueta) + '</button>';
                });
                h += '<input type="search" id="buscador" placeholder="Buscar cuenta" value="' + esc(estado.busqueda) + '" aria-label="Buscar cuenta"></div><div id="tablaCuentas"></div>';
                return h;
            }

            function celdaDifPesos(dif, p) {
                var clase = dif > 0 ? 'arriba' : dif < 0 ? 'abajo' : '';
                var signo = dif > 0 ? '+' : dif < 0 ? '-' : '';
                return '<span class="' + clase + '">' + flechaDe(dif) + ' ' + pctSigno(p) + '</span>' +
                    '<span class="sub">' + signo + '$' + numFmt(Math.abs(dif), 0) + '</span>';
            }
            function pintarTablaCuentas() {
                var d = datos, caja = document.getElementById('tablaCuentas');
                if (!caja) return;
                var lista = d.cuentas.filter(function (c) {return c.departamento === estado.depto;});
                if (estado.filtro !== 'Todos') lista = lista.filter(function (c) {return c.color === estado.filtro;});
                var q = estado.busqueda.trim().toLowerCase();
                if (q) lista = lista.filter(function (c) {return (c.cuenta + ' ' + c.nombre).toLowerCase().indexOf(q) >= 0;});
                var o = estado.orden.cuentas;
                if (o) lista = ordenar(lista, o.col, o.dir, o.tipo);
                else lista = lista.slice().sort(function (a, b) {
                    var sa = SEVERIDAD[a.color] === undefined ? 9 : SEVERIDAD[a.color];
                    var sb = SEVERIDAD[b.color] === undefined ? 9 : SEVERIDAD[b.color];
                    return sa - sb || b.diferencia - a.diferencia;
                });
                if (!lista.length) {caja.innerHTML = '<div class="vacio">No hay cuentas con ese filtro.</div>'; return;}
                var cols = [
                    {k: 'nombre', t: 'Cuenta', tipo: 'texto'}, {k: 'gastado', t: 'Presupuestado → gastado', num: true, movil: false},
                    {k: 'diferencia', t: 'Diferencia', num: true}, {k: 'color', t: 'Estado', tipo: 'texto', movil: false}
                ];
                var h = '<div class="tabla-caja"><table><thead><tr>';
                cols.forEach(function (c) {
                    var flecha = o && o.col === c.k ? (o.dir < 0 ? ' ▼' : ' ▲') : '';
                    h += '<th tabindex="0" class="orden' + (c.num ? ' num' : '') + (c.movil === false ? ' no-movil' : '') + '" data-accion="ordenar" data-tabla="cuentas" data-col="' + c.k + '" data-tipo="' + (c.tipo === 'texto' ? 'texto' : 'num') + '">' + esc(c.t) + flecha + '</th>';
                });
                h += '</tr></thead><tbody>';
                lista.forEach(function (c) {
                    var sp = c.color === 'Gasto sin presupuesto';
                    h += '<tr' + clic('cuenta', 'data-depto="' + encodeURIComponent(c.departamento) + '" data-cuenta="' + esc(c.cuenta) + '"') + '>' +
                        '<td class="nombre"><strong>' + esc(c.nombre) + '</strong><span class="sub">' + esc(c.cuenta) + '</span><span class="solo-movil">' + insignia(c.color) + '<span class="sub">' + (sp ? 'Gastado ' + m0(c.gastado) : 'Presupuestado ' + m0(c.presupuestadoFecha) + ' → gastado ' + m0(c.gastado)) + '</span></span></td>' +
                        '<td class="num no-movil">' + (sp ? 'Sin presupuesto → ' : m0(c.presupuestadoFecha) + ' → ') + m0(c.gastado) + '</td>' +
                        '<td class="num">' + (sp ? RAYA : celdaDifPesos(c.diferencia, c.difPct)) + '</td>' +
                        '<td class="no-movil">' + insignia(c.color) + '</td></tr>';
                });
                caja.innerHTML = h + '</tbody></table></div><div class="nota">' + lista.length + ' cuentas. Clic en una cuenta para ver los 12 meses y sus conceptos.</div>';
            }

            /* ---------- Detalle de cuenta ---------- */
            function vistaCuenta(d) {
                var c = d.cuentas.filter(function (x) {return x.departamento === estado.depto && x.cuenta === estado.cuenta;})[0];
                if (!c) return '<div class="error">No encuentro la cuenta.</div>';
                var det = d.detalle[clave(c.departamento, c.cuenta)];
                var sp = c.color === 'Gasto sin presupuesto';
                var h = '<div class="miga"><a tabindex="0" data-accion="vista" data-vista="departamentos">‹ Departamentos</a> › <a tabindex="0" data-accion="depto" data-depto="' + encodeURIComponent(c.departamento) + '">' + esc(c.departamento) + '</a> › <strong>' + esc(c.nombre) + '</strong></div>';
                h += '<h2 class="titulo">¿Cómo se comportó esta cuenta?</h2>';
                h += '<div class="kpis n3">' +
                    '<div class="kpi"><div class="et">Estado</div><div class="val chico">' + insignia(c.color) + '</div><div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><strong>' + esc(c.nombre) + '</strong></div><div class="sub">' + esc(c.cuenta) + '</div></div>' +
                    '<div class="kpi"><div class="et">Presupuestado a la fecha</div><div class="val">' + (sp ? '—' : mc(c.presupuestadoFecha)) + '</div><div class="sub">' + (sp ? 'Sin presupuesto del año' : 'Año completo: ' + mc(c.presupuestoAnio)) + '</div></div>' +
                    '<div class="kpi con"><div class="et">Gastado a la fecha</div><div class="val">' + mc(c.gastado) + '</div><div class="sub ' + (sp ? '' : c.diferencia > 0 ? 'arriba' : 'abajo') + '">' + (sp ? 'Todo es gasto sin presupuesto' : flechaDe(c.diferencia) + ' ' + pctSigno(c.difPct) + ' · ' + mc(Math.abs(c.diferencia))) + '</div></div>' +
                    '</div>';
                h += '<div class="kicker">Mes a mes</div><div class="tabla-caja"><table><thead><tr><th>Mes</th><th class="num no-movil">Presupuesto vigente</th><th class="num no-movil">Gasto real</th><th class="num">Diferencia</th></tr></thead><tbody>';
                var totP = 0, fechaP = 0, fechaG = 0;
                d.serieMensual.forEach(function (m, j) {
                    var p = det.presupuestoMes[j], g = det.gastoMes[j];
                    totP += p;
                    if (m.cerrado) {
                        fechaP += p; fechaG += g;
                        h += '<tr><td>' + esc(m.mes) + '<span class="solo-movil"><span class="sub">Presupuesto ' + m0(p) + ' → gasto ' + m0(g) + '</span></span></td><td class="num no-movil">' + m0(p) + '</td><td class="num no-movil">' + m0(g) + '</td><td class="num">' + celdaDifSimple(g - p, p) + '</td></tr>';
                    } else {
                        h += '<tr><td>' + esc(m.mes) + '<span class="sub">Sin cargar</span><span class="solo-movil"><span class="sub">Presupuesto ' + m0(p) + '</span></span></td><td class="num no-movil">' + m0(p) + '</td><td class="num no-movil">—</td><td class="num">—</td></tr>';
                    }
                });
                h += '<tr class="total"><td>A la fecha<span class="solo-movil"><span class="sub">Presupuesto ' + m0(fechaP) + ' → gasto ' + m0(fechaG) + '</span></span></td><td class="num no-movil">' + m0(fechaP) + '</td><td class="num no-movil">' + m0(fechaG) + '</td><td class="num">' + celdaDifSimple(fechaG - fechaP, fechaP) + '</td></tr>';
                h += '<tr class="total"><td>Año completo<span class="solo-movil"><span class="sub">Presupuesto ' + m0(totP) + '</span></span></td><td class="num no-movil">' + m0(totP) + '</td><td class="no-movil"></td><td></td></tr></tbody></table></div>';

                h += '<div class="kicker">Conceptos del presupuesto y su decisión</div>';
                if (!det.conceptos.length) {
                    h += '<div class="vacio">Esta cuenta no tiene presupuesto en el archivo del área. Todo su gasto cuenta como gasto sin presupuesto.</div>';
                } else {
                    h += '<div class="tabla-caja"><table><thead><tr><th>Concepto</th><th class="num">Presupuesto del año</th><th>Decisión</th><th class="no-movil">Motivo del cambio</th></tr></thead><tbody>';
                    det.conceptos.forEach(function (k) {
                        h += '<tr><td><strong>' + esc(k.concepto) + '</strong><span class="sub">' + esc(k.codigo) + ' · ' + esc(k.clase) + '</span></td><td class="num">' + m0(k.totalVigente) + '</td><td>' + insigniaDecision(k.decision) + '</td><td class="no-movil">' + esc(k.motivo) + '</td></tr>';
                    });
                    h += '</tbody></table></div>';
                }
                return h;
            }
            function celdaDifSimple(dif, pres) {
                var clase = dif > 0 ? 'arriba' : dif < 0 ? 'abajo' : '';
                var signo = dif > 0 ? '+' : dif < 0 ? '-' : '';
                var monto = signo + '$' + numFmt(Math.abs(dif), 0);
                if (pres && pres > 0) {
                    var p = dif / pres;
                    return '<span class="' + clase + '">' + flechaDe(dif) + ' ' + pctSigno(p) + '</span>' +
                        '<span class="sub">' + monto + '</span>';
                }
                return '<span class="' + clase + '">' + flechaDe(dif) + ' ' + monto + '</span>';
            }

            /* ---------- Avisos ---------- */
            function tablaAlertas(lista, idExpand) {
                lista = ordenar(lista, 'diferencia', -1, 'num');
                var expandida = estado.expandidas[idExpand];
                var mostrar = expandida ? lista : lista.slice(0, 10);
                var hayMas = lista.length > 10;
                var h = '<div class="tabla-caja"><table><thead><tr><th>Cuenta</th><th class="num no-movil">Presupuestado → gastado</th><th class="num">Diferencia</th></tr></thead><tbody>';
                mostrar.forEach(function (c) {
                    h += '<tr' + clic('cuenta', 'data-depto="' + encodeURIComponent(c.departamento) + '" data-cuenta="' + esc(c.cuenta) + '"') + '>' +
                        '<td class="nombre"><strong>' + esc(c.nombre) + '</strong><span class="sub">' + esc(c.departamento) + ' · ' + esc(c.cuenta) + '</span><span class="solo-movil"><span class="sub">Presupuestado ' + m0(c.presupuestadoFecha) + ' → gastado ' + m0(c.gastado) + '</span></span></td>' +
                        '<td class="num no-movil">' + m0(c.presupuestadoFecha) + ' → ' + m0(c.gastado) + '</td>' +
                        '<td class="num">' + celdaDifPesos(c.diferencia, c.difPct) + '</td></tr>';
                });
                h += '</tbody></table></div>';
                if (hayMas) {
                    var txt = expandida ? 'Ver solo top 10' : 'Ver todas (' + lista.length + ')';
                    h += '<div style="text-align:center;margin-top:var(--e2)"><button type="button" class="verMas" data-accion="toggleExpand" data-id="' + esc(idExpand) + '">' + esc(txt) + '</button></div>';
                }
                return h;
            }

            // Tabla de cuentas sin presupuesto (lista detallada por cuenta, no por depto).
            function tablaSinPresupuestoPorCuenta(d, idExpand) {
                var lista = d.cuentas.filter(function (c) {return c.color === 'Gasto sin presupuesto';});
                lista = lista.slice().sort(function (a, b) {return b.gastado - a.gastado;});
                var expandida = estado.expandidas[idExpand];
                var mostrar = expandida ? lista : lista.slice(0, 10);
                var hayMas = lista.length > 10;
                if (!lista.length) return '<div class="vacio">No hay gasto sin presupuesto.</div>';
                var h = '<div class="tabla-caja"><table><thead><tr><th>Cuenta</th><th class="num">Gastado</th></tr></thead><tbody>';
                mostrar.forEach(function (c) {
                    h += '<tr' + clic('cuenta', 'data-depto="' + encodeURIComponent(c.departamento) + '" data-cuenta="' + esc(c.cuenta) + '"') + '>' +
                        '<td class="nombre"><strong>' + esc(c.nombre) + '</strong><span class="sub">' + esc(c.departamento) + ' · ' + esc(c.cuenta) + '</span></td>' +
                        '<td class="num"><strong>' + m0(c.gastado) + '</strong></td></tr>';
                });
                h += '</tbody></table></div>';
                if (hayMas) {
                    var txt = expandida ? 'Ver solo top 10' : 'Ver todas (' + lista.length + ')';
                    h += '<div style="text-align:center;margin-top:var(--e2)"><button type="button" class="verMas" data-accion="toggleExpand" data-id="' + esc(idExpand) + '">' + esc(txt) + '</button></div>';
                }
                return h;
            }

            function tablaSinPresupuestoPorDepto(d) {
                var porDepto = {};
                d.cuentas.forEach(function (c) {
                    if (c.color !== 'Gasto sin presupuesto') return;
                    var x = porDepto[c.departamento] || (porDepto[c.departamento] = {nombre: c.departamento, cuentas: 0, gastado: 0});
                    x.cuentas++; x.gastado += c.gastado;
                });
                var lista = ordenar(Object.keys(porDepto).map(function (k) {return porDepto[k];}), 'gastado', -1, 'num');
                if (!lista.length) return '<div class="vacio">No hay gasto sin presupuesto.</div>';
                var total = sumar(lista, function (x) {return x.gastado;});
                var info = {};
                d.departamentos.forEach(function (x) {info[x.nombre] = x;});
                var h = '<div class="tabla-caja"><table><thead><tr><th>Departamento</th><th class="num no-movil">Cuentas</th><th class="num">Gasto sin presupuesto</th><th class="num">% del total</th></tr></thead><tbody>';
                lista.forEach(function (x) {
                    var i = info[x.nombre] || {};
                    h += '<tr' + clic('depto', 'data-depto="' + encodeURIComponent(x.nombre) + '"') + '><td class="nombre"><strong>' + esc(x.nombre) + '</strong><span class="sub">' + esc(i.estado || 'Sin dato') + '</span></td>' +
                        '<td class="num no-movil">' + x.cuentas + '</td><td class="num">' + m0(x.gastado) + '</td><td class="num">' + pct(total > 0 ? x.gastado / total : null) + '</td></tr>';
                });
                h += '<tr class="total"><td>Total</td><td class="num no-movil">' + sumar(lista, function (x) {return x.cuentas;}) + '</td><td class="num">' + m0(total) + '</td><td class="num">100.0%</td></tr>';
                return h + '</tbody></table></div>';
            }

            function tablaPicos(d) {
                var p = d.picos;
                if (!p.disponible) return '<div class="vacio">No encuentro el bloque de picos en la hoja Avisos.</div>';
                if (!p.filas.length) return '<div class="vacio">No hay pagos grandes marcados para ' + esc(p.mes || 'el próximo mes') + '.</div>';
                var h = '<div class="tabla-caja"><table><thead><tr><th>Concepto</th><th class="num">Presupuesto del mes</th><th class="num no-movil">Promedio mensual</th><th class="num">Veces el promedio</th></tr></thead><tbody>';
                p.filas.forEach(function (x) {
                    h += '<tr><td class="nombre"><strong>' + esc(x.concepto) + '</strong><span class="sub">' + esc(x.departamento) + ' · ' + esc(x.codigo) + '</span></td>' +
                        '<td class="num">' + m0(x.presupuestoMes) + '</td><td class="num no-movil">' + m0(x.promedio) + '</td><td class="num">' + numFmt(x.veces, 1) + ' veces</td></tr>';
                });
                return h + '</tbody></table></div>';
            }

            function vistaAvisos(d) {
                var rojos = d.cuentas.filter(function (c) {return c.color === 'Rojo';});
                var amar = d.cuentas.filter(function (c) {return c.color === 'Amarillo';});
                var sinPres = d.cuentas.filter(function (c) {return c.color === 'Gasto sin presupuesto';});
                var abajo = d.cuentas.filter(function (c) {return c.color !== 'Gasto sin presupuesto' && c.diferencia < 0;});
                var sr = sumar(rojos, function (c) {return c.diferencia;});
                var sa = sumar(amar, function (c) {return c.diferencia;});
                var sSinPres = sumar(sinPres, function (c) {return c.gastado;});
                var sAbajo = sumar(abajo, function (c) {return c.diferencia;});
                // Helper para decidir si un <details> renderiza con "open" según el estado guardado.
                function abierto(id) {return estado.seccionesAbiertas[id] ? ' open' : '';}
                var h = '<h2 class="titulo">¿Qué debo atender primero?</h2>';

                // Sección 1: Por explicar.
                h += '<details class="plegable" id="ancla-arriba" data-seccion="ancla-arriba"' + abierto('ancla-arriba') + '><summary>▲ Por explicar (' + rojos.length + ')' + (rojos.length ? ' · +' + mc(sr) + ' arriba' : '') + '</summary>';
                h += rojos.length ? tablaAlertas(rojos, 'rojos') : '<div class="vacio">Sin cuentas por explicar.</div>';
                h += '</details>';

                // Sección 2: Por revisar.
                if (amar.length) {
                    h += '<details class="plegable" data-seccion="ancla-revisar"' + abierto('ancla-revisar') + '><summary>◆ Por revisar (' + amar.length + ')' + (amar.length ? ' · +' + mc(sa) + ' arriba' : '') + '</summary>' + tablaAlertas(amar, 'amar') + '</details>';
                } else {
                    h += '<details class="plegable" data-seccion="ancla-revisar"' + abierto('ancla-revisar') + '><summary>◆ Por revisar (0)</summary><div class="vacio">Sin cuentas por revisar.</div></details>';
                }

                // Sección 3: Gasto sin presupuesto.
                h += '<details class="plegable" id="ancla-sinpres" data-seccion="ancla-sinpres"' + abierto('ancla-sinpres') + '><summary>○ Gasto sin presupuesto (' + sinPres.length + ')' + (sinPres.length ? ' · ' + mc(sSinPres) + ' gastados' : '') + '</summary>';
                h += tablaSinPresupuestoPorCuenta(d, 'sinpres');
                h += '</details>';

                // Sección 4: Cuentas abajo del presupuesto.
                if (abajo.length) {
                    h += '<details class="plegable" id="ancla-abajo" data-seccion="ancla-abajo"' + abierto('ancla-abajo') + '><summary>▼ Cuentas abajo del presupuesto (' + abajo.length + ') · ' + mc(sAbajo) + ' por debajo</summary>' + tablaAlertas(abajo, 'abajo') + '</details>';
                }

                // Sección 5: Pagos grandes del próximo mes.
                var p = d.picos, mes = p.mes || 'el próximo mes';
                h += '<h3 class="sec">Pagos grandes de ' + esc(mes) + '</h3>' + tablaPicos(d);
                return h;
            }

            /* ---------- Panel y pastilla del filtro de departamentos ---------- */
            function renderizarPanelDeptos() {
                if (!datos) return;
                var panel = document.getElementById('panelDeptos');
                if (!panel) return;
                var nombres = datos.departamentos.map(function (x) {return x.nombre;}).sort(function (a, b) {return a.localeCompare(b, 'es');});
                var set = deptosActivos();
                var h = '<div class="panel-acciones">' +
                    '<button type="button" data-accion="filtroDeptosTodos">Todos</button>' +
                    '<button type="button" data-accion="filtroDeptosNinguno">Ninguno</button></div>';
                nombres.forEach(function (n) {
                    h += '<label><input type="checkbox" data-accion="filtroDeptosToggle" data-nombre="' + esc(n) + '"' + (set[n] ? ' checked' : '') + '>' + esc(n) + '</label>';
                });
                panel.innerHTML = h;
            }
            function actualizarPastilla() {
                if (!datos) return;
                var p = document.getElementById('pastillaFiltro');
                if (!p) return;
                if (todosSeleccionados(datos)) {
                    p.style.display = 'none';
                } else {
                    p.style.display = 'inline-block';
                    p.textContent = (estado.filtroDeptos || []).length + ' de ' + datos.departamentos.length;
                }
            }
            function abrirCerrarPanel(forzarCerrar) {
                var panel = document.getElementById('panelDeptos');
                var btn = document.getElementById('btnFiltroDepto');
                if (!panel || !btn) return;
                var abierto = !panel.classList.contains('oculto');
                if (forzarCerrar || abierto) {
                    panel.classList.add('oculto');
                    btn.setAttribute('aria-expanded', 'false');
                    estado.panelAbierto = false;
                } else {
                    panel.classList.remove('oculto');
                    btn.setAttribute('aria-expanded', 'true');
                    estado.panelAbierto = true;
                }
            }
            function aplicarCambioFiltro() {
                guardarFiltro(estado.filtroDeptos);
                actualizarPastilla();
                pintar(true);
            }

            /* ---------- Eventos ---------- */
            function manejarAccion(el) {
                var accion = el.getAttribute('data-accion');
                if (accion === 'actualizar') {cargar(); return;}
                if (accion === 'toggleFiltroDepto') {abrirCerrarPanel(false); return;}
                if (!datos) return;
                if (accion === 'filtroDeptosTodos') {
                    estado.filtroDeptos = datos.departamentos.map(function (x) {return x.nombre;});
                    renderizarPanelDeptos(); aplicarCambioFiltro(); return;
                }
                if (accion === 'filtroDeptosNinguno') {
                    estado.filtroDeptos = [];
                    renderizarPanelDeptos(); aplicarCambioFiltro(); return;
                }
                if (accion === 'filtroDeptosToggle') {
                    var nombre = el.getAttribute('data-nombre');
                    var idx = estado.filtroDeptos.indexOf(nombre);
                    if (idx >= 0) estado.filtroDeptos.splice(idx, 1);
                    else estado.filtroDeptos.push(nombre);
                    aplicarCambioFiltro(); return;
                }
                if (accion === 'toggleExpand') {
                    var id = el.getAttribute('data-id');
                    estado.expandidas[id] = !estado.expandidas[id];
                    pintar(true);
                    return;
                }
                if (accion === 'irAvisos') {
                    var ancla = el.getAttribute('data-ancla');
                    estado.vista = 'avisos'; estado.depto = null; estado.cuenta = null;
                    // Marca la sección destino como abierta ANTES de pintar, así se renderiza con "open".
                    estado.seccionesAbiertas['ancla-' + ancla] = true;
                    pintar();
                    setTimeout(function () {
                        var destino = document.getElementById('ancla-' + ancla);
                        if (destino) destino.scrollIntoView({behavior: 'smooth', block: 'start'});
                    }, 50);
                    return;
                }
                if (accion === 'vista') {
                    estado.vista = el.getAttribute('data-vista'); estado.depto = null; estado.cuenta = null;
                } else if (accion === 'depto') {
                    estado.vista = 'departamento'; estado.depto = decodeURIComponent(el.getAttribute('data-depto')); estado.cuenta = null;
                    estado.filtro = 'Todos'; estado.busqueda = ''; delete estado.orden.cuentas;
                } else if (accion === 'cuenta') {
                    estado.vista = 'cuenta'; estado.depto = decodeURIComponent(el.getAttribute('data-depto')); estado.cuenta = el.getAttribute('data-cuenta');
                } else if (accion === 'filtro') {
                    estado.filtro = el.getAttribute('data-color');
                    pintar(true); return;
                } else if (accion === 'ordenar') {
                    var tabla = el.getAttribute('data-tabla'), col = el.getAttribute('data-col'), tipo = el.getAttribute('data-tipo');
                    var o = estado.orden[tabla];
                    estado.orden[tabla] = {col: col, tipo: tipo, dir: o && o.col === col ? -o.dir : (tipo === 'texto' ? 1 : -1)};
                    if (tabla === 'cuentas') {pintarTablaCuentas(); return;}
                    pintar(true); return;
                }
                pintar();
            }
            document.addEventListener('click', function (e) {
                // El <select> del filtro de impacto no debe propagarse al <th> que es clickeable para ordenar.
                if (e.target && e.target.tagName === 'SELECT' && e.target.getAttribute('data-accion') === 'filtroImpacto') {
                    e.stopPropagation();
                    return;
                }
                var el = e.target.closest ? e.target.closest('[data-accion]') : null;
                if (el) {manejarAccion(el); return;}
                // Cierra el panel del filtro si el clic cae fuera de él y de su botón.
                if (estado.panelAbierto) {
                    var dentroDelFiltro = e.target.closest && e.target.closest('.filtro-depto');
                    if (!dentroDelFiltro) abrirCerrarPanel(true);
                }
            });
            document.addEventListener('keydown', function (e) {
                if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('data-accion') && e.target.tagName !== 'BUTTON') {
                    e.preventDefault();
                    manejarAccion(e.target);
                }
            });
            document.addEventListener('input', function (e) {
                if (e.target && e.target.id === 'buscador') {estado.busqueda = e.target.value; pintarTablaCuentas();}
            });
            document.addEventListener('change', function (e) {
                if (e.target && e.target.getAttribute && e.target.getAttribute('data-accion') === 'filtroImpacto') {
                    estado.filtroImpacto = e.target.value;
                    pintar(true);
                }
            });
            // El evento "toggle" dispara cada vez que el usuario abre o cierra un <details>.
            // Lo capturamos en el documento con captura en true porque <details> no lo bubble-ea.
            document.addEventListener('toggle', function (e) {
                if (e.target && e.target.tagName === 'DETAILS' && e.target.hasAttribute('data-seccion')) {
                    var id = e.target.getAttribute('data-seccion');
                    estado.seccionesAbiertas[id] = e.target.open;
                }
            }, true);
            window.__tablero = {cargar: cargar, estado: estado};
            cargar();
        })();
    </script>
</body>

</html>
